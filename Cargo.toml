[workspace]
members = ["mmrs"]

resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freedesktop-rs/mmrs"

[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Allow some common patterns
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# Core dependencies
zbus = "5.16.0"
zvariant = "5.12.0"
log = "0.4.33"
thiserror = "2.0.18"
futures = "0.3.32"
mmrs = { path = "mmrs", version = "0.1" }
