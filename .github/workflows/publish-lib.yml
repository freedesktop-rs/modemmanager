name: Publish Library

on:
  push:
    tags:
      - 'mmrs-v*'

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Parse version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/mmrs-v}
          echo "VERSION=$TAG" >> $GITHUB_ENV
          echo "Publishing mmrs version: $TAG"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mmrs") | .version')
          if [ "$CARGO_VERSION" != "${{ env.VERSION }}" ]; then
            echo "Error: Cargo.toml version ($CARGO_VERSION) doesn't match tag version (${{ env.VERSION }})"
            exit 1
          fi
          echo "Version check passed: $CARGO_VERSION"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package mmrs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mmrs-v${{ env.VERSION }}
          name: mmrs ${{ env.VERSION }}
          body: |
            ## mmrs ${{ env.VERSION }}

            Published to [crates.io](https://crates.io/crates/mmrs/${{ env.VERSION }})

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          draft: false
          prerelease: false
